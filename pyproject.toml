[project]
name = "midterm-pro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javier-Gutierrez", email = "francisco.javier.flores.gtz@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
midterm-pro = "midterm_pro:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
